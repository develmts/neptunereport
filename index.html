<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neptune Reports</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Cinzel', 'serif'],
              mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
            },
            colors: {
              marine: {
                900: '#0a192f',
                800: '#112240',
                700: '#233554',
                400: '#64ffda', // Electric Teal
                300: '#8892b0', // Muted Slate
              },
              rebel: '#f97316', // Orange accent
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0a192f;
      }
      ::-webkit-scrollbar-thumb {
        background: #233554;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64ffda;
      }
      
      /* Vue Transitions */
      .fade-enter-active,
      .fade-leave-active {
        transition: opacity 0.3s ease;
      }
      .fade-enter-from,
      .fade-leave-to {
        opacity: 0;
      }

      .slide-fade-enter-active {
        transition: all 0.5s ease-out;
      }
      .slide-fade-leave-active {
        transition: all 0.5s cubic-bezier(1, 0.5, 0.8, 1);
      }
      .slide-fade-enter-from,
      .slide-fade-leave-to {
        transform: translateY(20px);
        opacity: 0;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "vue-router": "https://aistudiocdn.com/vue-router@^4.6.3",
    "vue": "https://aistudiocdn.com/vue@^3.5.24"
  }
}
</script>
</head>
  <body class="bg-marine-900 text-slate-200 antialiased selection:bg-marine-400 selection:text-marine-900">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
